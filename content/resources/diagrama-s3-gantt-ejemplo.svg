<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Diagrama de Gantt de ejemplo del montaje de una maqueta, con la ruta crítica T1-T2-T4 y la tarea T3 con dos dias de holgura">
<style>text{font-family:Verdana, 'DejaVu Sans', Arial, sans-serif;fill:#222222}</style>
<rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#453f93">Ejemplo: montaje de una maqueta</text>
<text x="380" y="48" text-anchor="middle" font-size="12" fill="#8a8a8a">Días laborables (los fines de semana no cuentan)</text>
<line x1="262.0" y1="66" x2="262.0" y2="250" stroke="#d8d8d8" stroke-width="1"/>
<line x1="329.7" y1="66" x2="329.7" y2="250" stroke="#d8d8d8" stroke-width="1"/>
<line x1="397.4" y1="66" x2="397.4" y2="250" stroke="#d8d8d8" stroke-width="1"/>
<line x1="465.1" y1="66" x2="465.1" y2="250" stroke="#d8d8d8" stroke-width="1"/>
<line x1="532.9" y1="66" x2="532.9" y2="250" stroke="#d8d8d8" stroke-width="1"/>
<line x1="600.6" y1="66" x2="600.6" y2="250" stroke="#d8d8d8" stroke-width="1"/>
<line x1="668.3" y1="66" x2="668.3" y2="250" stroke="#d8d8d8" stroke-width="1"/>
<line x1="736.0" y1="66" x2="736.0" y2="250" stroke="#d8d8d8" stroke-width="1"/>
<text x="295.9" y="58" text-anchor="middle" font-size="12" fill="#8a8a8a">Día 1</text>
<text x="363.6" y="58" text-anchor="middle" font-size="12" fill="#8a8a8a">Día 2</text>
<text x="431.3" y="58" text-anchor="middle" font-size="12" fill="#8a8a8a">Día 3</text>
<text x="499.0" y="58" text-anchor="middle" font-size="12" fill="#8a8a8a">Día 4</text>
<text x="566.7" y="58" text-anchor="middle" font-size="12" fill="#8a8a8a">Día 5</text>
<text x="634.4" y="58" text-anchor="middle" font-size="12" fill="#8a8a8a">Día 6</text>
<text x="702.1" y="58" text-anchor="middle" font-size="12" fill="#8a8a8a">Día 7</text>
<line x1="262" y1="66" x2="736" y2="66" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="16" y="82" font-size="13" font-weight="bold" fill="#c0392b">RUTA CRÍTICA</text>
<text x="16" y="200" font-size="13" font-weight="bold" fill="#2c6fad">CON HOLGURA</text>
<text x="34" y="113.0" font-size="13">T1 · Preparar materiales (2 d)</text>
<rect x="262.0" y="96" width="135.4" height="24" rx="4" fill="#e8c4be" stroke="#c0392b" stroke-width="2"/>
<text x="34" y="145.0" font-size="13">T2 · Cortar piezas (3 d)</text>
<rect x="397.4" y="128" width="203.1" height="24" rx="4" fill="#e8c4be" stroke="#c0392b" stroke-width="2"/>
<text x="34" y="177.0" font-size="13">T4 · Montar (2 d)</text>
<rect x="600.6" y="160" width="135.4" height="24" rx="4" fill="#e8c4be" stroke="#c0392b" stroke-width="2"/>
<text x="34" y="231.0" font-size="13">T3 · Pintar piezas (1 d)</text>
<rect x="397.4" y="214" width="67.7" height="24" rx="4" fill="#c3d8e9" stroke="#2c6fad" stroke-width="2"/>
<rect x="465.1" y="218" width="135.4" height="16" rx="3" fill="none" stroke="#2c6fad" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="532.9" y="231.0" text-anchor="middle" font-size="11" fill="#2c6fad">holgura 2 d</text>
<path d="M 397.4 108.0 L 406.4 108.0 L 406.4 140.0 L 393.4 140.0" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<polygon points="392.4,136.0 397.4,140.0 392.4,144.0" fill="#8a8a8a"/>
<path d="M 600.6 140.0 L 609.6 140.0 L 609.6 172.0 L 596.6 172.0" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<polygon points="595.6,168.0 600.6,172.0 595.6,176.0" fill="#8a8a8a"/>
<path d="M 397.4 108.0 L 406.4 108.0 L 406.4 226.0 L 393.4 226.0" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<polygon points="392.4,222.0 397.4,226.0 392.4,230.0" fill="#8a8a8a"/>
<rect x="262" y="268" width="20" height="12" rx="3" fill="#e8c4be" stroke="#c0392b" stroke-width="2"/>
<text x="290" y="278" font-size="12">tarea crítica (sin margen)</text>
<rect x="500" y="268" width="20" height="12" rx="3" fill="#c3d8e9" stroke="#2c6fad" stroke-width="2"/>
<text x="528" y="278" font-size="12">tarea con holgura</text>
</svg>