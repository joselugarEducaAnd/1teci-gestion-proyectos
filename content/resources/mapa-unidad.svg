<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 682" width="1000" height="682" role="img" aria-label="Mapa de la unidad: las nueve sesiones agrupadas en entender el problema, planificar el tiempo, organizar el trabajo y comunicarlo, y las nueve piezas que quedan en el plan de proyecto">
<style>text{font-family:Verdana, 'DejaVu Sans', Arial, sans-serif;fill:#222222}</style>
<rect width="1000" height="682" fill="#ffffff"/>
<text x="500.0" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#3b3a7a">Gestión y desarrollo de proyectos: el mapa de la unidad</text>
<text x="500.0" y="62" text-anchor="middle" font-size="13" fill="#6b6b6b">Del problema al plan, en nueve sesiones</text>
<rect x="20" y="84" width="232" height="32" rx="6" fill="#2c6046"/>
<text x="136.0" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">1 · ENTENDER EL PROBLEMA</text>
<rect x="20" y="128" width="232" height="92" rx="7" fill="#e8f0eb" stroke="#2c6046" stroke-width="1.5"/>
<rect x="20" y="128" width="5" height="92" rx="2.5" fill="#2c6046"/>
<text x="36" y="150" font-size="12" font-weight="bold" fill="#2c6046">S1 · Tecnología, proyectos</text>
<text x="36" y="165" font-size="12" font-weight="bold" fill="#2c6046">y equipo</text>
<text x="36" y="186" font-size="11">Qué es un proyecto. El equipo,</text>
<text x="36" y="200" font-size="11">sus roles y el diario.</text>
<rect x="20" y="230" width="232" height="92" rx="7" fill="#e8f0eb" stroke="#2c6046" stroke-width="1.5"/>
<rect x="20" y="230" width="5" height="92" rx="2.5" fill="#2c6046"/>
<text x="36" y="252" font-size="12" font-weight="bold" fill="#2c6046">S2 · El ciclo I+D+i y el</text>
<text x="36" y="267" font-size="12" font-weight="bold" fill="#2c6046">reto</text>
<text x="36" y="288" font-size="11">Del problema al producto. Un</text>
<text x="36" y="302" font-size="11">reto bien definido.</text>
<rect x="20" y="332" width="232" height="92" rx="7" fill="#e8f0eb" stroke="#2c6046" stroke-width="1.5"/>
<rect x="20" y="332" width="5" height="92" rx="2.5" fill="#2c6046"/>
<text x="36" y="354" font-size="12" font-weight="bold" fill="#2c6046">S3 · Design Thinking</text>
<text x="36" y="375" font-size="11">Empatizar, definir, idear,</text>
<text x="36" y="389" font-size="11">prototipar y testear.</text>
<path d="M 136.0 428 L 136.0 456" stroke="#2c6046" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="131.0,455 141.0,455 136.0,464" fill="#2c6046"/>
<rect x="264" y="84" width="232" height="32" rx="6" fill="#b23b3b"/>
<text x="380.0" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">2 · PLANIFICAR EL TIEMPO</text>
<rect x="264" y="128" width="232" height="92" rx="7" fill="#f9efee" stroke="#b23b3b" stroke-width="1.5"/>
<rect x="264" y="128" width="5" height="92" rx="2.5" fill="#b23b3b"/>
<text x="280" y="150" font-size="12" font-weight="bold" fill="#b23b3b">S4 · Diagrama de Gantt</text>
<text x="280" y="171" font-size="11">Tareas, duraciones y</text>
<text x="280" y="185" font-size="11">dependencias. Holgura.</text>
<rect x="264" y="230" width="232" height="92" rx="7" fill="#f9efee" stroke="#b23b3b" stroke-width="1.5"/>
<rect x="264" y="230" width="5" height="92" rx="2.5" fill="#b23b3b"/>
<text x="280" y="252" font-size="12" font-weight="bold" fill="#b23b3b">S5 · PERT/CPM</text>
<text x="280" y="273" font-size="11">Red de actividades. La ruta</text>
<text x="280" y="287" font-size="11">crítica, calculada.</text>
<path d="M 380.0 326 L 380.0 456" stroke="#b23b3b" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="375.0,455 385.0,455 380.0,464" fill="#b23b3b"/>
<rect x="508" y="84" width="232" height="32" rx="6" fill="#3b3a7a"/>
<text x="624.0" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">3 · ORGANIZAR EL TRABAJO</text>
<rect x="508" y="128" width="232" height="92" rx="7" fill="#ecebf5" stroke="#3b3a7a" stroke-width="1.5"/>
<rect x="508" y="128" width="5" height="92" rx="2.5" fill="#3b3a7a"/>
<text x="524" y="150" font-size="12" font-weight="bold" fill="#3b3a7a">S6 · Scrum: equipo y</text>
<text x="524" y="165" font-size="12" font-weight="bold" fill="#3b3a7a">artefactos</text>
<text x="524" y="186" font-size="11">Roles, backlog e incremento.</text>
<text x="524" y="200" font-size="11">Definición de Terminado.</text>
<rect x="508" y="230" width="232" height="92" rx="7" fill="#ecebf5" stroke="#3b3a7a" stroke-width="1.5"/>
<rect x="508" y="230" width="5" height="92" rx="2.5" fill="#3b3a7a"/>
<text x="524" y="252" font-size="12" font-weight="bold" fill="#3b3a7a">S7 · Scrum: el sprint en</text>
<text x="524" y="267" font-size="12" font-weight="bold" fill="#3b3a7a">marcha</text>
<text x="524" y="288" font-size="11">Los cuatro eventos. Historias</text>
<text x="524" y="302" font-size="11">de usuario.</text>
<rect x="508" y="332" width="232" height="92" rx="7" fill="#ecebf5" stroke="#3b3a7a" stroke-width="1.5"/>
<rect x="508" y="332" width="5" height="92" rx="2.5" fill="#3b3a7a"/>
<text x="524" y="354" font-size="12" font-weight="bold" fill="#3b3a7a">S8 · Kanban y Lean</text>
<text x="524" y="375" font-size="11">Tablero, límite WIP y</text>
<text x="524" y="389" font-size="11">desperdicio.</text>
<path d="M 624.0 428 L 624.0 456" stroke="#3b3a7a" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="619.0,455 629.0,455 624.0,464" fill="#3b3a7a"/>
<rect x="752" y="84" width="232" height="32" rx="6" fill="#8a4b2a"/>
<text x="868.0" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">4 · COMUNICARLO</text>
<rect x="752" y="128" width="232" height="92" rx="7" fill="#f3ebe5" stroke="#8a4b2a" stroke-width="1.5"/>
<rect x="752" y="128" width="5" height="92" rx="2.5" fill="#8a4b2a"/>
<text x="768" y="150" font-size="12" font-weight="bold" fill="#8a4b2a">S9 · Cierre y presentación</text>
<text x="768" y="171" font-size="11">Contar el plan en cinco</text>
<text x="768" y="185" font-size="11">minutos.</text>
<path d="M 868.0 224 L 868.0 456" stroke="#8a4b2a" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="863.0,455 873.0,455 868.0,464" fill="#8a4b2a"/>
<rect x="20" y="468" width="960" height="196" rx="10" fill="#fbfbfe" stroke="#3b3a7a" stroke-width="2"/>
<text x="500.0" y="496" text-anchor="middle" font-size="15" font-weight="bold" fill="#3b3a7a">Cada sesión deja una pieza en el PLAN DE PROYECTO del equipo</text>
<rect x="42" y="512" width="305" height="34" rx="17" fill="#ecebf5" stroke="#d0cfe6" stroke-width="1"/>
<rect x="50" y="519" width="26" height="20" rx="10" fill="#3b3a7a"/>
<text x="63" y="533.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">S1</text>
<text x="84" y="533.0" font-size="11.5">Equipo, roles y diario</text>
<rect x="357" y="512" width="305" height="34" rx="17" fill="#ecebf5" stroke="#d0cfe6" stroke-width="1"/>
<rect x="365" y="519" width="26" height="20" rx="10" fill="#3b3a7a"/>
<text x="378" y="533.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">S2</text>
<text x="399" y="533.0" font-size="11.5">Reto y criterio de éxito</text>
<rect x="672" y="512" width="305" height="34" rx="17" fill="#ecebf5" stroke="#d0cfe6" stroke-width="1"/>
<rect x="680" y="519" width="26" height="20" rx="10" fill="#3b3a7a"/>
<text x="693" y="533.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">S3</text>
<text x="714" y="533.0" font-size="11.5">Solución ideada</text>
<rect x="42" y="556" width="305" height="34" rx="17" fill="#ecebf5" stroke="#d0cfe6" stroke-width="1"/>
<rect x="50" y="563" width="26" height="20" rx="10" fill="#3b3a7a"/>
<text x="63" y="577.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">S4</text>
<text x="84" y="577.0" font-size="11.5">Diagrama de Gantt</text>
<rect x="357" y="556" width="305" height="34" rx="17" fill="#ecebf5" stroke="#d0cfe6" stroke-width="1"/>
<rect x="365" y="563" width="26" height="20" rx="10" fill="#3b3a7a"/>
<text x="378" y="577.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">S5</text>
<text x="399" y="577.0" font-size="11.5">Red PERT/CPM con la ruta crítica</text>
<rect x="672" y="556" width="305" height="34" rx="17" fill="#ecebf5" stroke="#d0cfe6" stroke-width="1"/>
<rect x="680" y="563" width="26" height="20" rx="10" fill="#3b3a7a"/>
<text x="693" y="577.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">S6</text>
<text x="714" y="577.0" font-size="11.5">Backlog y Definición de Terminado</text>
<rect x="42" y="600" width="305" height="34" rx="17" fill="#ecebf5" stroke="#d0cfe6" stroke-width="1"/>
<rect x="50" y="607" width="26" height="20" rx="10" fill="#3b3a7a"/>
<text x="63" y="621.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">S7</text>
<text x="84" y="621.0" font-size="11.5">Historias de usuario y primer sprint</text>
<rect x="357" y="600" width="305" height="34" rx="17" fill="#ecebf5" stroke="#d0cfe6" stroke-width="1"/>
<rect x="365" y="607" width="26" height="20" rx="10" fill="#3b3a7a"/>
<text x="378" y="621.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">S8</text>
<text x="399" y="621.0" font-size="11.5">Tablero Kanban</text>
<rect x="672" y="600" width="305" height="34" rx="17" fill="#ecebf5" stroke="#d0cfe6" stroke-width="1"/>
<rect x="680" y="607" width="26" height="20" rx="10" fill="#3b3a7a"/>
<text x="693" y="621.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">S9</text>
<text x="714" y="621.0" font-size="11.5">Presentación del plan</text>
<text x="500.0" y="654" text-anchor="middle" font-size="11" fill="#6b6b6b" font-style="italic">Y se defiende ante la clase: un plan que no se sabe contar no convence a nadie.</text>
</svg>