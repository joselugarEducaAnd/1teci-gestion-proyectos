<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Tablero Kanban con tres columnas: Por hacer, En curso (con límite WIP de 2 tarjetas) y Hecho. Las tarjetas avanzan de izquierda a derecha.">
  <defs>
    <marker id="fk" markerWidth="5" markerHeight="5" refX="3.2" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#453f93"/>
    </marker>
  </defs>

  <!-- Flecha de flujo -->
  <path d="M70,40 L930,40" fill="none" stroke="#453f93" stroke-width="5" marker-end="url(#fk)"/>
  <text x="500" y="30" text-anchor="middle" fill="#453f93" font-size="14" font-weight="bold">las tarjetas avanzan de izquierda a derecha</text>

  <!-- Columna POR HACER -->
  <rect x="40" y="60" width="280" height="380" rx="12" fill="#f3f2fa" stroke="#c2bfe2" stroke-width="1.5"/>
  <rect x="40" y="60" width="280" height="48" rx="12" fill="#453f93"/>
  <rect x="40" y="92" width="280" height="16" fill="#453f93"/>
  <text x="180" y="91" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">POR HACER</text>
  <g>
    <rect x="62" y="126" width="236" height="58" rx="8" fill="#ffffff" stroke="#9c98cf" stroke-width="1.5"/>
    <rect x="74" y="140" width="150" height="9" rx="3" fill="#9c98cf"/><circle cx="282" cy="168" r="8" fill="#d2722a"/>
    <rect x="62" y="196" width="236" height="58" rx="8" fill="#ffffff" stroke="#9c98cf" stroke-width="1.5"/>
    <rect x="74" y="210" width="120" height="9" rx="3" fill="#9c98cf"/><circle cx="282" cy="238" r="8" fill="#4f8f43"/>
    <rect x="62" y="266" width="236" height="58" rx="8" fill="#ffffff" stroke="#9c98cf" stroke-width="1.5"/>
    <rect x="74" y="280" width="160" height="9" rx="3" fill="#9c98cf"/><circle cx="282" cy="308" r="8" fill="#453f93"/>
  </g>

  <!-- Columna EN CURSO -->
  <rect x="360" y="60" width="280" height="380" rx="12" fill="#fbf3ec" stroke="#e7c4a3" stroke-width="1.5"/>
  <rect x="360" y="60" width="280" height="48" rx="12" fill="#453f93"/>
  <rect x="360" y="92" width="280" height="16" fill="#453f93"/>
  <text x="486" y="91" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">EN CURSO</text>
  <rect x="556" y="71" width="74" height="26" rx="13" fill="#d2722a"/>
  <text x="593" y="89" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">WIP ≤ 2</text>
  <g>
    <rect x="382" y="126" width="236" height="58" rx="8" fill="#ffffff" stroke="#d2722a" stroke-width="1.5"/>
    <rect x="394" y="140" width="140" height="9" rx="3" fill="#c98a5a"/><circle cx="602" cy="168" r="8" fill="#4f8f43"/>
    <rect x="382" y="196" width="236" height="58" rx="8" fill="#ffffff" stroke="#d2722a" stroke-width="1.5"/>
    <rect x="394" y="210" width="110" height="9" rx="3" fill="#c98a5a"/><circle cx="602" cy="238" r="8" fill="#453f93"/>
  </g>
  <text x="500" y="300" text-anchor="middle" fill="#a85718" font-size="12.5" font-style="italic">no se abren más hasta terminar alguna</text>

  <!-- Columna HECHO -->
  <rect x="680" y="60" width="280" height="380" rx="12" fill="#eef5ec" stroke="#bcd9b3" stroke-width="1.5"/>
  <rect x="680" y="60" width="280" height="48" rx="12" fill="#453f93"/>
  <rect x="680" y="92" width="280" height="16" fill="#453f93"/>
  <text x="820" y="91" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">HECHO</text>
  <g>
    <rect x="702" y="126" width="236" height="58" rx="8" fill="#ffffff" stroke="#9bc48e" stroke-width="1.5"/>
    <rect x="714" y="140" width="130" height="9" rx="3" fill="#9bc48e"/>
    <path d="M906,150 l9,10 l18,-20" fill="none" stroke="#4f8f43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="702" y="196" width="236" height="58" rx="8" fill="#ffffff" stroke="#9bc48e" stroke-width="1.5"/>
    <rect x="714" y="210" width="150" height="9" rx="3" fill="#9bc48e"/>
    <path d="M906,220 l9,10 l18,-20" fill="none" stroke="#4f8f43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Leyenda responsable -->
  <circle cx="60" cy="424" r="7" fill="#666"/>
  <text x="74" y="429" fill="#555" font-size="12">cada tarjeta = una tarea con su responsable</text>
</svg>
