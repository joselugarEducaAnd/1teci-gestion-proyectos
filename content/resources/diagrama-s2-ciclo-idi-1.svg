<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" width="940" height="250" role="img" aria-label="Ciclo I+D+i: de la necesidad a la innovación, con una flecha de vuelta que indica que lo aprendido alimenta nuevas mejoras"><style>text{font-family:Verdana, 'DejaVu Sans', Arial, sans-serif;fill:#222222}</style><rect width="940" height="250" fill="#ffffff"/><rect x="20" y="46" width="200" height="66" rx="9" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="2"/><text x="120.0" y="68.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b6b6b">Necesidad</text><text x="120.0" y="84.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b6b6b">o problema</text><text x="120.0" y="100.5" text-anchor="middle" font-size="13" fill="#222222">algo que resolver</text><line x1="224" y1="79.0" x2="251" y2="79.0" stroke="#6b6b6b" stroke-width="2.2"/><polygon points="250,74.0 258,79.0 250,84.0" fill="#6b6b6b"/><rect x="262" y="46" width="200" height="66" rx="9" fill="#e8f0eb" stroke="#2c6046" stroke-width="2"/><text x="362.0" y="76.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c6046">Investigación (I)</text><text x="362.0" y="92.5" text-anchor="middle" font-size="13" fill="#222222">generar conocimiento</text><line x1="466" y1="79.0" x2="493" y2="79.0" stroke="#6b6b6b" stroke-width="2.2"/><polygon points="492,74.0 500,79.0 492,84.0" fill="#6b6b6b"/><rect x="504" y="46" width="190" height="66" rx="9" fill="#ecebf5" stroke="#3b3a7a" stroke-width="2"/><text x="599.0" y="76.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#3b3a7a">Desarrollo (D)</text><text x="599.0" y="92.5" text-anchor="middle" font-size="13" fill="#222222">construir la solución</text><line x1="698" y1="79.0" x2="715" y2="79.0" stroke="#6b6b6b" stroke-width="2.2"/><polygon points="714,74.0 722,79.0 714,84.0" fill="#6b6b6b"/><rect x="726" y="46" width="194" height="66" rx="9" fill="#f7e6e3" stroke="#c0392b" stroke-width="2"/><text x="823.0" y="76.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Innovación (i)</text><text x="823.0" y="92.5" text-anchor="middle" font-size="13" fill="#222222">llega a la gente</text><path d="M 823.0 116 L 823.0 166 L 120.0 166 L 120.0 124" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="7 5"/><polygon points="115.0,125 125.0,125 120.0,115" fill="#c0392b"/><text x="470.0" y="157" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c0392b">lo aprendido abre nuevas necesidades y mejoras</text><text x="470.0" y="194" text-anchor="middle" font-size="12.5" fill="#6b6b6b" font-style="italic">Por eso el proceso es iterativo: no termina en la innovación, vuelve a empezar.</text></svg>