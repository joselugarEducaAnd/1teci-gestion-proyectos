<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" width="800" height="356" role="img" aria-label="Red PERT/CPM en forma actividad-en-nodo: del círculo de Inicio salen A, luego B y C en paralelo, y ambas llegan a D y al círculo de Fin. La ruta crítica A B D va en rojo; C tiene dos días de holgura"><style>text{font-family:Verdana, 'DejaVu Sans', Arial, sans-serif;fill:#222222}</style><rect width="800" height="356" fill="#ffffff"/><circle cx="54" cy="157.0" r="27" fill="#ffffff" stroke="#6b6b6b" stroke-width="2"/><text x="54" y="161.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b6b6b">Inicio</text><circle cx="726" cy="157.0" r="27" fill="#ffffff" stroke="#6b6b6b" stroke-width="2"/><text x="726" y="161.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b6b6b">Fin</text><rect x="128" y="130" width="116" height="54" rx="9" fill="#f7e6e3" stroke="#c0392b" stroke-width="2"/><text x="186.0" y="154.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">A</text><text x="186.0" y="170.5" text-anchor="middle" font-size="13" fill="#222222">3 días</text><rect x="310" y="62" width="116" height="54" rx="9" fill="#f7e6e3" stroke="#c0392b" stroke-width="2"/><text x="368.0" y="86.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">B</text><text x="368.0" y="102.5" text-anchor="middle" font-size="13" fill="#222222">4 días</text><rect x="310" y="198" width="116" height="54" rx="9" fill="#e6eff8" stroke="#2c6fb0" stroke-width="2"/><text x="368.0" y="222.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c6fb0">C</text><text x="368.0" y="238.5" text-anchor="middle" font-size="13" fill="#222222">2 días</text><rect x="500" y="130" width="116" height="54" rx="9" fill="#f7e6e3" stroke="#c0392b" stroke-width="2"/><text x="558.0" y="154.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">D</text><text x="558.0" y="170.5" text-anchor="middle" font-size="13" fill="#222222">3 días</text><line x1="81" y1="157.0" x2="117" y2="157.0" stroke="#6b6b6b" stroke-width="2.2"/><polygon points="116,152.0 124,157.0 116,162.0" fill="#6b6b6b"/><path d="M 244 157.0 L 270 157.0 L 270 89.0 L 302 89.0" fill="none" stroke="#c0392b" stroke-width="2.4"/><polygon points="301,84.0 309,89.0 301,94.0" fill="#c0392b"/><path d="M 244 157.0 L 290 157.0 L 290 225.0 L 302 225.0" fill="none" stroke="#2c6fb0" stroke-width="2.4"/><polygon points="301,220.0 309,225.0 301,230.0" fill="#2c6fb0"/><path d="M 426 89.0 L 454 89.0 L 454 157.0 L 492 157.0" fill="none" stroke="#c0392b" stroke-width="2.4"/><path d="M 426 225.0 L 474 225.0 L 474 157.0 L 492 157.0" fill="none" stroke="#2c6fb0" stroke-width="2.4"/><polygon points="491,152.0 499,157.0 491,162.0" fill="#c0392b"/><line x1="616" y1="157.0" x2="692" y2="157.0" stroke="#c0392b" stroke-width="2.2"/><polygon points="691,152.0 699,157.0 691,162.0" fill="#c0392b"/><text x="368.0" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c6fb0">2 días de holgura</text><text x="384.0" y="310" text-anchor="end" font-size="13" font-weight="bold" fill="#c0392b">A → B → D = 3 + 4 + 3 = 10 días</text><text x="400.0" y="310" text-anchor="middle" font-size="13" fill="#6b6b6b">·</text><text x="416.0" y="310" text-anchor="start" font-size="13" fill="#2c6fb0">A → C → D = 3 + 2 + 3 = 8 días</text><text x="400.0" y="336" text-anchor="middle" font-size="12.5" fill="#222222">La ruta crítica es el camino más largo: marca la duración mínima del proyecto.</text></svg>