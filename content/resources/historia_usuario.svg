<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Anatomía de una historia de usuario: Como (quién), quiero (qué), para (beneficio o valor).">
  <!-- Segmento 1: Como (quién) -->
  <rect x="40" y="56" width="290" height="104" rx="14" fill="#4f8f43" stroke="#3c6e33" stroke-width="2"/>
  <text x="185" y="98" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">Como…</text>
  <text x="185" y="130" text-anchor="middle" fill="#eaf3e6" font-size="15">(tipo de usuario)</text>
  <text x="185" y="186" text-anchor="middle" fill="#3c6e33" font-size="16" font-weight="bold">QUIÉN</text>

  <!-- Segmento 2: quiero (qué) -->
  <rect x="365" y="56" width="290" height="104" rx="14" fill="#453f93" stroke="#322d6e" stroke-width="2"/>
  <text x="510" y="98" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">quiero…</text>
  <text x="510" y="130" text-anchor="middle" fill="#dcdaf0" font-size="15">(algo)</text>
  <text x="510" y="186" text-anchor="middle" fill="#453f93" font-size="16" font-weight="bold">QUÉ</text>

  <!-- Segmento 3: para (beneficio) -->
  <rect x="690" y="56" width="290" height="104" rx="14" fill="#d2722a" stroke="#a85718" stroke-width="2"/>
  <text x="835" y="98" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">para…</text>
  <text x="835" y="130" text-anchor="middle" fill="#fbe9da" font-size="15">(un beneficio)</text>
  <text x="835" y="186" text-anchor="middle" fill="#a85718" font-size="16" font-weight="bold">PARA QUÉ · el valor</text>

  <!-- Ejemplo -->
  <rect x="40" y="224" width="940" height="64" rx="12" fill="#f3f2fa" stroke="#c2bfe2" stroke-width="1.5"/>
  <text x="62" y="252" fill="#1d2444" font-size="15"><tspan font-weight="bold">Ejemplo:&#160;</tspan><tspan fill="#3c6e33" font-weight="bold">Como</tspan> estudiante, <tspan fill="#453f93" font-weight="bold">quiero</tspan> recibir un aviso antes de cada entrega,</text>
  <text x="62" y="276" fill="#1d2444" font-size="15"><tspan fill="#a85718" font-weight="bold">para</tspan> no olvidarme de subir la tarea a tiempo.</text>
</svg>
