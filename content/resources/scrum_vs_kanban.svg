<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Comparación entre Scrum y Kanban por ritmo, roles, cambios, tablero y foco. Ambos son marcos Agile y pueden combinarse (Scrumban).">
  <!-- Cabeceras -->
  <rect x="250" y="50" width="360" height="56" rx="10" fill="#453f93"/>
  <text x="430" y="86" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">SCRUM</text>
  <rect x="624" y="50" width="336" height="56" rx="10" fill="#6f69b3"/>
  <text x="792" y="86" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">KANBAN</text>

  <!-- Filas -->
  <g font-size="14.5" fill="#1d2444">
    <!-- fila 1 -->
    <rect x="40" y="116" width="920" height="58" rx="8" fill="#f3f2fa"/>
    <text x="56" y="151" fill="#453f93" font-weight="bold">Ritmo</text>
    <text x="430" y="151" text-anchor="middle">Sprints de duración fija</text>
    <text x="792" y="151" text-anchor="middle">Flujo continuo, sin sprints</text>
    <!-- fila 2 -->
    <rect x="40" y="180" width="920" height="58" rx="8" fill="#ffffff"/>
    <text x="56" y="215" fill="#453f93" font-weight="bold">Roles</text>
    <text x="430" y="215" text-anchor="middle">3 roles definidos</text>
    <text x="792" y="215" text-anchor="middle">Sin roles obligatorios</text>
    <!-- fila 3 -->
    <rect x="40" y="244" width="920" height="58" rx="8" fill="#f3f2fa"/>
    <text x="56" y="279" fill="#453f93" font-weight="bold">Cambios</text>
    <text x="430" y="279" text-anchor="middle">Al cerrar el sprint</text>
    <text x="792" y="279" text-anchor="middle">En cualquier momento</text>
    <!-- fila 4 -->
    <rect x="40" y="308" width="920" height="58" rx="8" fill="#ffffff"/>
    <text x="56" y="343" fill="#453f93" font-weight="bold">Tablero</text>
    <text x="430" y="343" text-anchor="middle">Se reinicia cada sprint</text>
    <text x="792" y="343" text-anchor="middle">Permanente</text>
    <!-- fila 5 -->
    <rect x="40" y="372" width="920" height="58" rx="8" fill="#f3f2fa"/>
    <text x="56" y="400" fill="#453f93" font-weight="bold">Foco</text>
    <text x="430" y="400" text-anchor="middle">Comprometerse con un sprint</text>
    <text x="792" y="400" text-anchor="middle">Limitar el trabajo en curso (WIP)</text>
  </g>

  <!-- Separador columnas -->
  <line x1="610" y1="116" x2="610" y2="430" stroke="#dcdaf0" stroke-width="2"/>
  <line x1="240" y1="116" x2="240" y2="430" stroke="#dcdaf0" stroke-width="2"/>

  <text x="500" y="450" text-anchor="middle" fill="#4f8f43" font-size="13.5" font-weight="bold">Los dos son marcos Agile · se pueden combinar (Scrumban)</text>
</svg>
