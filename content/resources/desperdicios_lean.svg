<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="El desperdicio en Lean (muda): todo lo que consume tiempo o recursos sin aportar valor. Tipos habituales: esperas, rehacer por errores, trabajo de más, tareas duplicadas, idas y venidas y cosas a medias.">
  <!-- Centro -->
  <circle cx="500" cy="235" r="96" fill="#453f93"/>
  <text x="500" y="222" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">DESPERDICIO</text>
  <text x="500" y="246" text-anchor="middle" fill="#dcdaf0" font-size="14" font-style="italic">(muda)</text>
  <text x="500" y="268" text-anchor="middle" fill="#dcdaf0" font-size="12">no aporta valor</text>

  <!-- Conectores -->
  <g stroke="#e7c4a3" stroke-width="3">
    <line x1="245" y1="96" x2="404" y2="196"/>
    <line x1="245" y1="235" x2="404" y2="235"/>
    <line x1="245" y1="374" x2="404" y2="274"/>
    <line x1="755" y1="96" x2="596" y2="196"/>
    <line x1="755" y1="235" x2="596" y2="235"/>
    <line x1="755" y1="374" x2="596" y2="274"/>
  </g>

  <!-- Pastillas de desperdicio -->
  <g>
    <rect x="40" y="66" width="210" height="60" rx="14" fill="#fbe9da" stroke="#d2722a" stroke-width="2"/>
    <text x="145" y="93" text-anchor="middle" fill="#a85718" font-size="16" font-weight="bold">Esperas</text>
    <text x="145" y="113" text-anchor="middle" fill="#7a4517" font-size="11.5">esperar a otro o a un recurso</text>

    <rect x="40" y="205" width="210" height="60" rx="14" fill="#fbe9da" stroke="#d2722a" stroke-width="2"/>
    <text x="145" y="232" text-anchor="middle" fill="#a85718" font-size="16" font-weight="bold">Rehacer</text>
    <text x="145" y="252" text-anchor="middle" fill="#7a4517" font-size="11.5">corregir errores ya hechos</text>

    <rect x="40" y="344" width="210" height="60" rx="14" fill="#fbe9da" stroke="#d2722a" stroke-width="2"/>
    <text x="145" y="371" text-anchor="middle" fill="#a85718" font-size="16" font-weight="bold">Trabajo de más</text>
    <text x="145" y="391" text-anchor="middle" fill="#7a4517" font-size="11.5">más de lo que se pidió</text>

    <rect x="750" y="66" width="210" height="60" rx="14" fill="#fbe9da" stroke="#d2722a" stroke-width="2"/>
    <text x="855" y="93" text-anchor="middle" fill="#a85718" font-size="16" font-weight="bold">Tareas duplicadas</text>
    <text x="855" y="113" text-anchor="middle" fill="#7a4517" font-size="11.5">hacer dos veces lo mismo</text>

    <rect x="750" y="205" width="210" height="60" rx="14" fill="#fbe9da" stroke="#d2722a" stroke-width="2"/>
    <text x="855" y="232" text-anchor="middle" fill="#a85718" font-size="16" font-weight="bold">Idas y venidas</text>
    <text x="855" y="252" text-anchor="middle" fill="#7a4517" font-size="11.5">movimiento innecesario</text>

    <rect x="750" y="344" width="210" height="60" rx="14" fill="#fbe9da" stroke="#d2722a" stroke-width="2"/>
    <text x="855" y="371" text-anchor="middle" fill="#a85718" font-size="16" font-weight="bold">Cosas a medias</text>
    <text x="855" y="391" text-anchor="middle" fill="#7a4517" font-size="11.5">acumular sin terminar</text>
  </g>

  <text x="500" y="446" text-anchor="middle" fill="#4f8f43" font-size="14" font-weight="bold">Lean busca eliminar el desperdicio y dejar solo lo que aporta valor</text>
</svg>
