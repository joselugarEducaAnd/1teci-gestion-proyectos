<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Línea de tiempo de un sprint: empieza con la planificación, cada día una reunión diaria, y termina con la revisión y la retrospectiva.">
  <!-- Línea base -->
  <line x1="70" y1="108" x2="930" y2="108" stroke="#453f93" stroke-width="5" stroke-linecap="round"/>

  <!-- Hito inicial: Planificación -->
  <circle cx="96" cy="108" r="15" fill="#453f93"/>
  <text x="96" y="160" text-anchor="middle" fill="#1d2444" font-size="14" font-weight="bold">Planificación</text>
  <text x="96" y="178" text-anchor="middle" fill="#666" font-size="11.5">inicio del sprint</text>

  <!-- Días: reuniones diarias -->
  <g>
    <circle cx="270" cy="108" r="9" fill="#ffffff" stroke="#453f93" stroke-width="3"/>
    <circle cx="390" cy="108" r="9" fill="#ffffff" stroke="#453f93" stroke-width="3"/>
    <circle cx="510" cy="108" r="9" fill="#ffffff" stroke="#453f93" stroke-width="3"/>
    <circle cx="630" cy="108" r="9" fill="#ffffff" stroke="#453f93" stroke-width="3"/>
  </g>
  <text x="270" y="70" text-anchor="middle" fill="#453f93" font-size="12">daily</text>
  <text x="390" y="70" text-anchor="middle" fill="#453f93" font-size="12">daily</text>
  <text x="510" y="70" text-anchor="middle" fill="#453f93" font-size="12">daily</text>
  <text x="630" y="70" text-anchor="middle" fill="#453f93" font-size="12">daily</text>
  <text x="450" y="50" text-anchor="middle" fill="#666" font-size="11.5" font-style="italic">una reunión diaria cada jornada…</text>

  <!-- Hito: Revisión -->
  <circle cx="820" cy="108" r="15" fill="#453f93"/>
  <text x="820" y="160" text-anchor="middle" fill="#1d2444" font-size="14" font-weight="bold">Revisión</text>

  <!-- Hito: Retrospectiva -->
  <circle cx="908" cy="108" r="15" fill="#453f93"/>
  <text x="908" y="178" text-anchor="middle" fill="#1d2444" font-size="14" font-weight="bold">Retrospectiva</text>

  <!-- Etiqueta fin -->
  <text x="864" y="50" text-anchor="middle" fill="#666" font-size="11.5">fin del sprint</text>
</svg>
